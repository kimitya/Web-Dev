        <title>Challenge: Write a Poem</title>
        <meta charset="utf-8">
    </head>
    <body>
    <h1> On seashore far a green oak towers…</h1>
    <p> On seashore far a green oak towers, <br>
And to it with a gold chain bound,<br>
A learned cat whiles away the hours <br>
By walking slowly round and round.</p>
